name: R input and coloc checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-r:
    name: Base R checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure APT for R setup
        shell: bash
        run: |
          sudo install -m 0644 .github/apt-r-ci.conf /etc/apt/apt.conf.d/99-crc-gwas-eqtl-ci
          apt-config dump | grep -Fx 'APT::Install-Recommends "false";'
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Check inputs and allele alignment
        run: Rscript --vanilla tests/run_tests.R

  coloc-smoke:
    name: Pinned coloc integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure APT for R setup
        shell: bash
        run: |
          sudo install -m 0644 .github/apt-r-ci.conf /etc/apt/apt.conf.d/99-crc-gwas-eqtl-ci
          apt-config dump | grep -Fx 'APT::Install-Recommends "false";'
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Restore pinned test packages
        run: Rscript --vanilla tests/coloc/setup.R
      - name: Compare R fits with preserved synthetic results
        run: Rscript --vanilla tests/run_coloc_smoke.R
